<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog Topic Finder</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d8dee4;--acc:#0b6b8a;--soft:#e3f1f6}
@media(prefers-color-scheme:dark){:root{--bg:#0f161c;--card:#18222b;--ink:#e8eef3;--mute:#92a1ae;--line:#2b3946;--acc:#5cc3e0;--soft:#16303a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:30px 18px 60px}
h1{font:700 1.8rem/1.2 Georgia,serif;margin:0 0 6px}p.s{color:var(--mute);margin:0 0 22px;max-width:62ch}
.box,.idea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}label:first-child{margin:0}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:70px}input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
.go{width:100%;margin-top:16px;padding:12px;background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}.go:disabled{opacity:.6}
.msg{margin-top:16px;color:var(--mute)}.err{color:#c0392b}
.sum{background:var(--soft);border-radius:8px;padding:14px 16px;margin:22px 0 14px}
.sum ol{margin:8px 0 0;padding-left:20px;font-size:.9rem;color:var(--mute)}.sum a{color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.bar h2{margin:0;font-size:1.1rem}
.idea{margin-bottom:10px}.idea h3{margin:0 0 6px;font-size:1.05rem;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.t{font-size:.76rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mute)}
.t.k{background:var(--soft);color:var(--acc);border-color:transparent}.idea p{margin:0 0 8px;font-size:.92rem}.idea ul{margin:0 0 10px;padding-left:18px;color:var(--mute);font-size:.88rem}
</style></head><body><main>
<h1>Blog Topic Finder</h1>
<p class="s">Enter a keyword. The tool checks what people search for around it, then an AI model suggests 10 in-depth topics that work together to build topical authority.</p>
<div class="box">
<label for="kw">Keyword</label><input id="kw" placeholder="e.g. CIPD assignment help" autocomplete="off">
<label for="aud">Audience (optional)</label><input id="aud" placeholder="e.g. UK HR students, Level 5">
<label for="used">Titles you already have (one per line, optional)</label><textarea id="used" placeholder="Paste your published titles so they are skipped"></textarea>
<button class="go" id="go">Find 10 topics</button><div id="st" class="msg"></div></div>
<div id="out"></div></main>
<script>
const $=i=>document.getElementById(i);let last=null;
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
function copy(t,b){navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=o,1100)})}
async function run(){
 const kw=$("kw").value.trim();if(!kw){$("kw").focus();return}
 $("go").disabled=true;$("st").className="msg";$("st").textContent="Researching, this can take up to a minute…";$("out").innerHTML="";
 try{
  const failed=[];let d=null;
  for(const p of ["tokenharbor","gemini","groq","openrouter"]){
   $("st").textContent="Trying "+p+"…";
   try{
    const r=await fetch("/.netlify/functions/research",{method:"POST",body:JSON.stringify({keyword:kw,audience:$("aud").value,used:$("used").value,provider:p})});
    const j=await r.json();if(r.ok){d=j;break}failed.push(p+": "+(j.error||r.status));
   }catch(e){failed.push(p+": "+(e.message||"timed out"))}
  }
  if(!d)throw new Error("All providers failed. "+failed.join(" | "));
  d.failed=failed;last=d;render(d);$("st").textContent=""
 }catch(e){$("st").className="msg err";$("st").textContent=e.message}
 $("go").disabled=false}
function render(d){
 let h='<div class="sum"><b>Generated by '+esc(d.provider)+'</b>'+(d.grounded?' with live Google Search':'')+'<br>'+esc(d.intent)+
  (d.failed&&d.failed.length?'<br><small>Fallback used. Earlier errors: '+esc(d.failed.join(" | "))+'</small>':'')+
  (d.sources&&d.sources.length?'<ol>'+d.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title||s.url)+'</a></li>').join("")+'</ol>':'')+'</div>';
 h+='<div class="bar"><h2>'+d.ideas.length+' topics</h2><span><button id="all">Copy all</button> <button id="csv">Download CSV</button></span></div>';
 d.ideas.forEach((x,i)=>{h+='<div class="idea"><h3>'+(i+1)+'. '+esc(x.title)+'</h3><div class="meta"><span class="t k">'+esc(x.primary_keyword)+'</span><span class="t">'+esc(x.angle)+'</span><span class="t">'+esc(x.cluster)+(x.pillar?': '+esc(x.pillar):'')+'</span><span class="t">Demand (est.): '+esc(x.est_demand)+'</span><span class="t">Competition (est.): '+esc(x.est_competition)+'</span></div><p>'+esc(x.why)+'</p>'+(x.outline.length?'<ul>'+x.outline.map(o=>'<li>'+esc(o)+'</li>').join("")+'</ul>':'')+'<button data-i="'+i+'">Copy title</button></div>'});
 $("out").innerHTML=h}
$("out").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!last)return;
 if(b.id==="all")copy(last.ideas.map((x,i)=>(i+1)+". "+x.title).join("\n"),b);
 else if(b.id==="csv"){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const rows=[["title","primary_keyword","angle","cluster","pillar","est_demand","est_competition","why"]].concat(last.ideas.map(x=>[x.title,x.primary_keyword,x.angle,x.cluster,x.pillar,x.est_demand,x.est_competition,x.why]));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="topics.csv";a.click()}
 else if(b.dataset.i)copy(last.ideas[+b.dataset.i].title,b)});
$("go").onclick=run;$("kw").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
</script></body></html>
